[package]
name = "yousufos"
version = "1.9.0"
description = "YousufOS - Islamic-focused Smart TV launcher for Linux"
authors = ["Yousuf"]
edition = "2021"

[lib]
name = "yousufos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
tungstenite = "0.24"
# Admin panel: a small web server on the home network.
tiny_http = "0.12"
getrandom = "0.2"

# Desktop only (the Android version uses the TV's own launcher, keys and remote).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
gilrs = "0.11"
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Same WebKitGTK bindings Tauri uses; needed to turn on GPU rendering.
webkit2gtk = "=2.0.2"
# In-process keyboard / mouse events for apps opened inside YousufOS.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
