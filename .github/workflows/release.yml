# Builds YousufOS and publishes a GitHub release. Either:
#   push the code to the "release" branch:  git push origin main:release
#   or push a version tag:                  git tag v1.8.1 && git push origin v1.8.1
# The version comes from package.json (a tag must match it). TVs with updates
# turned on (Settings → System → Updates) find the release and offer to install
# it. The release has the .deb and a SHA256SUMS file the TV checks.
# Release notes come from that version's section in CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.look.outputs.tag }}
      exists: ${{ steps.look.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json is $v but the tag is ${GITHUB_REF_NAME}"; exit 1; }
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          # A release that was already published (by hand or earlier) is left alone.
          if gh release view "v$v" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "v$v is already released"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        timeout-minutes: 12
        run: |
          # Package mirrors sometimes hang: short timeouts, retries, and only Ubuntu's own sources.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          # GitHub's runners use Azure's Ubuntu mirror, which sometimes stops answering: use Ubuntu's own.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do sudo timeout 240 apt-get $APT update && break; echo "apt-get update failed, retrying"; sleep 10; done
          sudo timeout 480 apt-get $APT install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libudev-dev build-essential curl file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: |
          npm ci
          npx eslint src --quiet
          npx tauri build --bundles deb

      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle/deb
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "YousufOS $v" > notes.md
          printf '\n---\n**Install:** download `YousufOS_%s_amd64.deb`, then on the TV laptop run `sudo apt install ./YousufOS_%s_amd64.deb`, or update from the TV (Settings → System → Updates).\n' "$v" "$v" >> notes.md
          cd src-tauri/target/release/bundle/deb
          gh release create "$TAG" *.deb SHA256SUMS --target "$GITHUB_SHA" \
            --title "YousufOS $v" --notes-file "$GITHUB_WORKSPACE/notes.md"
