# Builds YousufOS (Ubuntu .deb, Windows installer and Android TV .apk) and publishes a GitHub release. Either:
#   push the code to the "release" branch:  git push origin main:release
#   or push a version tag:                  git tag v1.8.1 && git push origin v1.8.1
# The version comes from package.json (a tag must match it). TVs with updates
# turned on (Settings → System → Updates) find the release and offer to install
# it. The release has the .deb, the .apk and a SHA256SUMS file the TV checks.
# The .apk is signed with the YousufOS key from two repository secrets:
#   YOUSUFOS_KEYSTORE_B64       the keystore file, base64
#   YOUSUFOS_KEYSTORE_PASSWORD  its password
# (Without them the release has no .apk.)
# The repository is public, so TVs download updates without a token.
# Release notes come from that version's section in CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.look.outputs.tag }}
      exists: ${{ steps.look.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json is $v but the tag is ${GITHUB_REF_NAME}"; exit 1; }
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          # A release that was already published (by hand or earlier) is left alone.
          if gh release view "v$v" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "v$v is already released"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

  deb:
    needs: check
    if: needs.check.outputs.exists != '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        timeout-minutes: 20
        run: |
          # Package mirrors sometimes hang: short timeouts, retries, and only Ubuntu's own sources.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          # GitHub's runners use Azure's Ubuntu mirror, which sometimes stops answering:
          # use HTTPS mirrors (apt moves down the list on failure).
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu/ https://mirror.us.leaseweb.net/ubuntu/ https://ftp.uni-stuttgart.de/ubuntu/ \
            https://mirror.pit.teraswitch.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i -E 's#http://(azure\.)?archive\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#g; s#http://security\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/apt-mirrors.txt#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          grep -h URIs /etc/apt/sources.list.d/*.sources || true
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for i in 1 2 3; do sudo timeout 240 apt-get $APT update && break; echo "apt-get update failed, retrying"; sleep 10; done
          sudo timeout 480 apt-get $APT install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libudev-dev build-essential curl file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: |
          npm ci
          npx eslint src --quiet
          npx tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb

  android:
    needs: check
    if: needs.check.outputs.exists != '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: key
        env:
          KS: ${{ secrets.YOUSUFOS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::No signing key (YOUSUFOS_KEYSTORE_B64): this release has no Android .apk."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/yousufos.jks"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.key.outputs.ok == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - if: steps.key.outputs.ok == '1'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - if: steps.key.outputs.ok == '1'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Build the .apk
        if: steps.key.outputs.ok == '1'
        env:
          YOUSUFOS_KEYSTORE: ${{ runner.temp }}/yousufos.jks
          YOUSUFOS_KEYSTORE_PASSWORD: ${{ secrets.YOUSUFOS_KEYSTORE_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm ci
          npx tauri android build --apk --target aarch64 armv7
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "out/YousufOS_${v}_android.apk"
          ls -la out

      - if: steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  windows:
    needs: check
    if: needs.check.outputs.exists != '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows

      - name: Build the Windows installer
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles nsis
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe

  publish:
    needs: [check, deb, android, windows]
    # The release goes out with whatever built (the laptop .deb is a must).
    if: ${{ !cancelled() && needs.deb.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          v="${TAG#v}"
          cd dist-release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "YousufOS $v" > notes.md
          printf '\n---\n**Install on Ubuntu:** download `YousufOS_%s_amd64.deb`, then on the TV laptop run `sudo apt install ./YousufOS_%s_amd64.deb`, or update from the TV (Settings → System → Updates).\n' "$v" "$v" >> notes.md
          if ls dist-release/*-setup.exe > /dev/null 2>&1; then
            printf '\n**Install on Windows:** run `YousufOS_%s_x64-setup.exe`. After that it updates from Settings → System → Updates.\n' "$v" >> notes.md
          fi
          if ls dist-release/*.apk > /dev/null 2>&1; then
            printf '\n**Install on Android TV:** `YousufOS_%s_android.apk`; see [docs/android-tv.md](docs/android-tv.md) for the first install. After that, update from the TV.\n' "$v" >> notes.md
          fi
          gh release create "$TAG" dist-release/* --target "$GITHUB_SHA" \
            --title "YousufOS $v" --notes-file notes.md

